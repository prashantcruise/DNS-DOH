services:
  dnscrypt-odoh:
    image: dnscrypt-doh:latest
    build:
      context: .
      dockerfile: dockerfile
    container_name: dnscrypt-odoh
    environment:
      DNSCRYPT_CONFIG: /config/dnscrypt-proxy-odoh.toml
      DNSCRYPT_PORT: "5053"
    ports:
      - "5053:5053/udp"
      - "5053:5053/tcp"
    restart: unless-stopped

  dnscrypt-doh:
    image: dnscrypt-doh:latest
    container_name: dnscrypt-doh
    environment:
      DNSCRYPT_CONFIG: /config/dnscrypt-proxy-doh.toml
      DNSCRYPT_PORT: "5054"
    ports:
      - "5054:5054/udp"
      - "5054:5054/tcp"
    restart: unless-stopped

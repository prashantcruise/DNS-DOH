listen_addresses = ['0.0.0.0:5053']

server_names = ['cloudflare-family']

ipv4_servers = true
ipv6_servers = false

dnscrypt_servers = false
doh_servers = true

require_dnssec = true
require_nolog = true
require_nofilter = false

bootstrap_resolvers = [
  '1.1.1.1:53',
  '1.0.0.1:53'
]

cache = true
cache_size = 4096
